<svg width="1360" height="640" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="680" height="320" fill="#faf9f5"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="60" width="140" height="56" rx="8" fill="#fbeaf0" stroke="#993556" stroke-width="0.5"/>
<text x="110" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#72243e">Surprise me</text>
<text x="110" y="101" text-anchor="middle" font-size="11" fill="#993556">GP6 (pin 9) to GND</text>
<line x1="180" y1="88" x2="216" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="60" width="130" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="285" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2a">Debounce</text>
<text x="285" y="101" text-anchor="middle" font-size="11" fill="#5f5e5a">50 ms, edge only</text>
<line x1="350" y1="88" x2="386" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="390" y="60" width="150" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="465" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2a">New deal</text>
<text x="465" y="101" text-anchor="middle" font-size="11" fill="#5f5e5a">fade out, reseed, fade in</text>
<path d="M465 116 L465 150 L340 150 L340 178" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120" y="182" width="440" height="98" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="340" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Fresh constellation (same character)</text>
<text x="340" y="230" text-anchor="middle" font-size="12" fill="#0f6e56">re-seed entropy: 16 stirred ADC reads</text>
<text x="340" y="248" text-anchor="middle" font-size="12" fill="#0f6e56">re-deal all 16 dapples: anchors, sizes, speeds, phases</text>
<text x="340" y="266" text-anchor="middle" font-size="12" fill="#0f6e56">engine and palette unchanged; light breathes out and back in</text>
